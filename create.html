<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>〇〇展をつくる</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="top"><span class="tiny">THE SOCIAL EXHIBITION</span><span class="brand">みんなの〇〇展</span><span class="tiny">2026</span></header>
<main class="wrap">
<div class="tiny">CURATE YOUR EXHIBITION</div><h1>あなたの〇〇展をひらく。</h1><p class="muted">思い出をひとつずつ、あなたの順番で。</p>
<p class="notice">この段階では、このブラウザーの中だけに保存・公開されます。写真は軽量化します。動画は1本1MBまで。保存容量には上限があります。</p>
<p id="save-status" class="muted" role="status"></p><div id="message" role="alert" class="message" hidden></div>
<label class="label" for="title">展覧会のタイトル</label><input id="title" class="field" maxlength="100" placeholder="例：俺の青春 展">
<label class="label" for="desc">この展覧会について</label><textarea id="desc" class="field" maxlength="3000" rows="3" placeholder="どんな展覧会？"></textarea>
<div class="controls"><h2 class="section">展示する作品</h2><span id="wc">0 / 30作品</span></div><div id="works"></div>
<div class="actions"><button class="pill" id="add-work">＋ 作品を追加</button><label class="pill file-picker">写真・動画から追加<input id="files" type="file" accept="image/*,video/*" multiple></label></div>
<p class="muted">文章だけの作品も展示できます。写真・動画は各作品に1つ。順番は「↑ 前へ」「↓ 後へ」で変更できます。</p>
<div class="actions editor-actions"><button class="pill" id="preview">展覧会をプレビュー</button><button class="primary" id="publish">この〇〇展を公開する</button></div>
</main><nav class="bottom">
