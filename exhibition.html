<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人生で一番笑った日 展</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f4ee;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
a{text-decoration:none;color:inherit}button,input,textarea{font:inherit}.top{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #ddd;background:#f7f4ee}

.cover{height:270px;background:#eee9df;display:flex;align-items:center;justify-content:center;font-size:88px}.pad{padding:20px}.enter,.primary{display:block;width:100%;text-align:center;border:0;background:#222;color:#fff;padding:14px;border-radius:25px;margin-top:15px}

.bottom{position:fixed;bottom:0;left:0;right:0;height:70px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;align-items:center}.bottom a{text-align:center;font-size:11px;color:#666}.bottom b{display:block;font-size:19px;margin-bottom:3px}.plus{background:#222!important;color:#fff!important;width:45px;height:45px;border-radius:50%;font-size:25px!important;display:flex;align-items:center;justify-content:center}
.back{font-size:29px}.art{min-height:350px;background:#fff;border:1px solid #ddd;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;position:relative}
.emoji{font-size:90px}.caption{font:21px/1.6 Georgia,serif;margin-top:20px}.num{position:absolute;right:15px;bottom:14px;font-size:11px;color:#999}.controls{display:flex;justify-content:space-between;align-items:center;margin:18px 0}.pill{border:1px solid #ddd;background:#fff;border-radius:22px;padding:10px 16px}
.comments{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px}.form{display:flex;gap:7px}.form input{flex:1;min-width:0;border:1px solid #ddd;border-radius:20px;padding:10px}.send{border:0;background:#222;color:#fff;border-radius:20px;padding:9px 14px}
.field{width:100%;border:1px solid #ddd;background:#fff;border-radius:10px;padding:13px;margin:7px 0 15px}.label{font-size:12px;color:#666}.upload{display:block;border:1.5px dashed #aaa;background:#fffaf2;text-align:center;padding:26px;border-radius:13px;margin-top:10px}.work{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin-top:12px}

<body><header class="top"><span class="tiny">THE SOCIAL EXHIBITION</span><span class="brand">みんなの〇〇展</span><span class="tiny">2026</span></header>
<main class="wrap">
<a class="back" href="index.html">‹</a><h1>人生で一番笑った日 展</h1><p class="muted">by そら ｜ 12,842 来場</p>
<div class="tiny" id="room">ROOM 01 / 30</div><section class="art"><div class="emoji" id="emoji">😂</div><div class="caption" id="caption">「笑いすぎて、息ができなかった日。」</div><div class="num" id="num">01 / 30</div></section>
<div class="controls"><button class="pill" id="prev">← 前へ</button><span id="count">1 / 30</span><button class="pill" id="next">次へ →</button></div>
<div style="margin-bottom:18px"><button class="pill" id="like">♡ 共感</button></div>
<section class="comments"><h3>この作品へのコメント</h3><div id="comments"><p class="muted">まだコメントはありません。</p></div><div class="form"><input id="ci" placeholder="コメントを書く…"><button class="send" id="send">送信</button></div></section>

var p=1,liked={},comments={},icons=['😂','📷','🌙','🎒','☀️','🚲','🍜','🎧','🌊','🎆','🚃','☕','🌸','⚽','🎮','🍂','🏫','🌧️','🎂','🎡','🐕','📚','🎤','🍙','🌅','🎬','⭐','🛣️','🫶','✨'];
function render(){document.getElementById('room').textContent='ROOM '+String(p).padStart(2,'0')+' / 30';document.getElementById('num').textContent=String(p).padStart(2,'0')+' / 30';document.getElementById('count').textContent=p+' / 30';document.getElementById('emoji').textContent=icons[p-1];document.getElementById('caption').textContent=p==1?'「笑いすぎて、息ができなかった日。」':'「思い出の中に残っている、'+p+'番目の景色。」';document.getElementById('like').textContent=liked[p]?'♥ 共感済み':'♡ 共感';var b=document.getElementById('comments'),a=comments[p]||[];b.innerHTML=a.length?'':'<p class="muted">まだコメントはありません。</p>';a.forEach(function(t){var d=document.createElement('p');d.textContent='あなた　'+t;b.appendChild(d)})}
document.getElementById('next').onclick=function(){if(p<30)p++;render()};document.getElementById('prev').onclick=function(){if(p>1)p--;render()};document.getElementById('like').onclick=function(){liked[p]=!liked[p];render()};document.getElementById('send').onclick=function(){var i=document.getElementById('ci'),t=i.value.trim();if(!t)return;(comments[p]||(comments[p]=[])).push(t);i.value='';render()};
</script></body></html>
